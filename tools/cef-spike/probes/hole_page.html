<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>CEF INSIDE HOLE</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    font: 20px/1.5 -apple-system, system-ui, sans-serif;
    color: #eaf7ef;
    background: linear-gradient(135deg, #0d3b2e 0%, #10604a 45%, #1f8f6f 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px;
  }
  h1 { margin: 0; font-size: 30px; letter-spacing: 1px; }
  .tag { font-size: 14px; opacity: .85; }
  .count { font-variant-numeric: tabular-nums; font-size: 16px; }
</style>
</head>
<body>
  <h1>CEF INSIDE HOLE</h1>
  <div class="tag">若你看到这段渐变文字，CEF 子视图已正确显示在挖洞区域内</div>
  <div class="count" id="count">mousedown 0 · mouseup 0 · click 0</div>
<script>
// 事件与加载证据经 zap 的回环通道形态上报(阶段 1 的 IPC shim 同构)。
const LOG = 'http://127.0.0.1:9911/webview-ipc';
const send = (msg) => {
  try { fetch(LOG, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: msg }); } catch (e) {}
};
const n = { mousedown: 0, mouseup: 0, click: 0 };
const paint = () => {
  document.getElementById('count').textContent =
    `mousedown ${n.mousedown} · mouseup ${n.mouseup} · click ${n.click}`;
};
window.addEventListener('mousedown', () => { n.mousedown++; paint(); send('probe.mousedown'); }, true);
window.addEventListener('mouseup', () => { n.mouseup++; paint(); send('probe.mouseup'); }, true);
window.addEventListener('click', () => { n.click++; paint(); send('probe.click'); }, true);
window.addEventListener('load', () => send('probe.loaded'), { once: true });
</script>
</body>
</html>

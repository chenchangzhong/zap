[package]
name = "cef-spike"
edition = "2021"
publish = false

# 独立于 zap 根 workspace:空 [workspace] 表使本目录成为独立 crate。
# 更动仅限 tools/cef-spike,app 二进制默认构建零影响(specs/cef-webview-minimal/TECH.md 阶段 0)。
[workspace]

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "cef-spike"

[[bin]]
name = "cef-spike-helper"

[[bin]]
name = "make-bundle"
path = "src/bin/make_bundle.rs"
required-features = []

# 阶段 1 第一生死项探针(CEF 子视图 × zap 挖洞分层窗口)
[[bin]]
name = "hole-probe"
path = "src/bin/hole-probe.rs"

[build-dependencies]
cc = "1"

# spec 决策:Developer ID 分发,不启用 CEF sandbox(sandbox feature 与 MAS 归属绑定,
# 而本仓库 spd 侧确认不进 MAS);site-isolation 保持 CEF 默认(关)。
[features]
default = []
sandbox = ["cef/sandbox"]

[package.metadata.cef.bundle]
helper_name = "cef-spike-helper"
resources_path = "resources"

[dependencies]
cef = { version = "152.4.0", features = [
    "build-util",
] }
semver = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", features = [
    "NSApplication",
    "NSEvent",
    "NSResponder",
    "NSUserInterfaceValidation",
    "NSView",
    "NSWindow",
] }

# 来源:tauri-apps/cef-rs dev 分支 examples/cefsimple 浅克隆移植(2026-09-20)。
# CEF 二进制供给:chromium-152.0.7977.134 macosarm64 minimal,~/.local/share/cef
# (经 export-cef-dir 解包,arm64 单架构,spec 单架构决策)。
